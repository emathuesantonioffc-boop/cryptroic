name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Package Unsigned IPA
        run: |
          set -euo pipefail
          PROJECT_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" -not -path './.git/*' -print -quit || true)
          TARGET_DIR=$(dirname "$PROJECT_PATH")
          cd "$TARGET_DIR"
          BUILD_DIR="$PWD/build"
          ARCHIVE="$BUILD_DIR/Cryptroic.xcarchive"
          IPA="$BUILD_DIR/Cryptroic-unsigned.ipa"
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme Cryptroic \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive
          APP="$ARCHIVE/Products/Applications/Cryptroic.app"
          if [ -d "ThreeOneOSFive/Patches" ]; then
            mkdir -p "$APP/Patches"
            cp -R "ThreeOneOSFive/Patches/"*.3105 "$APP/Patches/" 2>/dev/null || true
          fi
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP" "$BUILD_DIR/Payload/"
          (cd "$BUILD_DIR" && zip -qry "$IPA" Payload && rm -rf Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cryptroic-unsigned-ipa
          path: "**/build/Cryptroic-unsigned.ipa"
          retention-days: 7
